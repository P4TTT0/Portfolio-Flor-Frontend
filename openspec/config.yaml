# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Next.js 16.2.4, React 19.2.4, TypeScript 5.x, Tailwind CSS v4, PostCSS
  CMS: Sanity (next-sanity v12, @sanity/client v7)
  Architecture: Next.js App Router with src/ directory, @/ path alias
  Testing: None configured — no test runner or test files detected
  Styling: Tailwind CSS v4 (PostCSS plugin), custom kraft-texture patterns
  Components: Landing portfolio — Bio, Samples, Demos, Social sections
  Animations: Lenis smooth scroll, Embla carousel, react-icons
  Conventions: AGENTS.md warns Next.js 16 has breaking changes over training data

rules:
  proposal:
    - Scope changes clearly; include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns in src/
    - Respect AGENTS.md Next.js 16 caveats
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: null
  runner_command: null
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  linter: eslint
  type_checker: typescript
  formatter: null
